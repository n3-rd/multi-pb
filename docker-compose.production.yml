# Production docker-compose.yml example
# Copy this file and customize for your deployment

services:
  multipb:
    image: ghcr.io/n3-rd/multi-pb:latest
    # Or build from source:
    # build: .
    container_name: multipb
    restart: unless-stopped
    ports:
      # Single port for all instances
      # Use 127.0.0.1 prefix if behind reverse proxy
      - "127.0.0.1:25983:25983"
      
      # Or expose directly (uncomment below, comment above)
      # - "25983:25983"
    volumes:
      # Use absolute path for production
      - /srv/multipb/data:/var/multipb/data
    environment:
      # External port (must match host port mapping)
      - MULTIPB_PORT=25983
      
      # Data directory inside container
      - MULTIPB_DATA_DIR=/var/multipb/data
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:25983/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

