# Multi-PB Docker Compose Configuration
# Single-container multi-instance PocketBase manager

services:
  multipb:
    build: .
    container_name: multipb
    restart: unless-stopped
    ports:
      # Single external port for all instances
      - "${MULTIPB_PORT:-25983}:${MULTIPB_PORT:-25983}"
    volumes:
      # Single volume for all instance data
      - multipb-data:/var/multipb/data
    environment:
      # External port (default: 25983, can be configured)
      - MULTIPB_PORT=${MULTIPB_PORT:-25983}
      
      # Data directory inside container
      - MULTIPB_DATA_DIR=/var/multipb/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MULTIPB_PORT:-25983}/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  multipb-data:
